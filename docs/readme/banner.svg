<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030305"/><stop offset="0.55" stop-color="#14070E"/><stop offset="1" stop-color="#5B1020"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="62%" r="48%"><stop offset="0" stop-color="#EF4444" stop-opacity="0.38"/><stop offset="0.55" stop-color="#991B1B" stop-opacity="0.16"/><stop offset="1" stop-color="#030305" stop-opacity="0"/></radialGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5C451"/><stop offset="0.45" stop-color="#EF4444"/><stop offset="1" stop-color="#7F1D1D"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FEF3C7"/><stop offset="0.5" stop-color="#F5C451"/><stop offset="1" stop-color="#F97316"/></linearGradient>
<linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A0D18"/><stop offset="1" stop-color="#0C0508"/></linearGradient>
<linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22080E"/><stop offset="1" stop-color="#050304"/></linearGradient>
<clipPath id="cl"><rect width="900" height="340" rx="20"/></clipPath>
</defs>
<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes drift{0%{transform:translateX(-30px) translateY(0);opacity:0}15%{opacity:.85}85%{opacity:.85}100%{transform:translateX(60px) translateY(-18px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.04);opacity:1}}
@keyframes scan{0%{transform:translateY(-20px);opacity:0}20%{opacity:.25}80%{opacity:.25}100%{transform:translateY(340px);opacity:0}}
.st{animation:tw 3.2s ease-in-out infinite}
.em{animation:drift 6s linear infinite}
.sn{transform-origin:450px 210px;animation:pulse 5.5s ease-in-out infinite}
.sc{animation:scan 5s linear infinite}
</style>
<g clip-path="url(#cl)">
<rect width="900" height="340" fill="url(#sky)"/>
<rect width="900" height="340" fill="url(#glow)"/>
<circle class="st" cx="85" cy="48" r="1.5" fill="#FDE68A" style="animation-delay:.1s"/>
<circle class="st" cx="170" cy="76" r="1.2" fill="#FFFFFF" style="animation-delay:.9s"/>
<circle class="st" cx="255" cy="38" r="1.8" fill="#FCA5A5" style="animation-delay:1.4s"/>
<circle class="st" cx="350" cy="60" r="1.2" fill="#FFFFFF" style="animation-delay:2.1s"/>
<circle class="st" cx="565" cy="52" r="1.6" fill="#FDE68A" style="animation-delay:.4s"/>
<circle class="st" cx="655" cy="84" r="1.3" fill="#FFFFFF" style="animation-delay:1.8s"/>
<circle class="st" cx="760" cy="42" r="1.7" fill="#FCA5A5" style="animation-delay:2.5s"/>
<circle class="st" cx="835" cy="72" r="1.4" fill="#FFFFFF" style="animation-delay:.7s"/>
<circle class="sn" cx="450" cy="215" r="118" fill="url(#sun)" opacity="0.22"/>
<polygon points="0,340 160,210 340,285 520,190 710,275 900,205 900,340" fill="url(#m1)" opacity="0.85"/>
<polygon points="0,340 120,255 290,305 460,235 640,295 810,245 900,280 900,340" fill="url(#m2)"/>
<g opacity="0.16" stroke="#F5C451" stroke-width="1">
<line x1="0" y1="295" x2="900" y2="295"/><line x1="0" y1="315" x2="900" y2="315"/>
<line x1="180" y1="260" x2="90" y2="340"/><line x1="360" y1="260" x2="315" y2="340"/>
<line x1="540" y1="260" x2="585" y2="340"/><line x1="720" y1="260" x2="810" y2="340"/>
</g>
<rect class="sc" x="0" y="0" width="900" height="2" fill="#F5C451" opacity="0.22"/>
<circle class="em" cx="140" cy="290" r="2.2" fill="#F5C451" style="animation-delay:0s"/>
<circle class="em" cx="320" cy="310" r="1.8" fill="#EF4444" style="animation-delay:1.5s"/>
<circle class="em" cx="560" cy="300" r="2.4" fill="#F5C451" style="animation-delay:2.8s"/>
<circle class="em" cx="740" cy="285" r="2" fill="#FB923C" style="animation-delay:4.1s"/>
<rect x="275" y="42" width="350" height="28" rx="14" fill="#1F0B12" stroke="#F5C451" stroke-opacity="0.45"/>
<text x="450" y="60.5" text-anchor="middle" class="m" font-size="11.5" font-weight="bold" fill="#F5C451" letter-spacing="2.2">PLN UP3 JAMBI • SISTEM INFORMASI</text>
<g transform="translate(450, 128)">
<polygon points="-8,-38 14,-38 0,-8 18,-8 -14,34 -2,2 -18,2" fill="#F5C451" opacity="0.18"/>
</g>
<text x="450" y="156" text-anchor="middle" class="s" font-size="52" font-weight="900" fill="url(#tg)" letter-spacing="5">SIGINJAI PLN</text>
<text x="450" y="196" text-anchor="middle" class="s" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="3.5">MONITORING PERENCANAAN &amp; KONSTRUKSI</text>
<line x1="210" y1="218" x2="690" y2="218" stroke="#F5C451" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="450" y="246" text-anchor="middle" class="m" font-size="13.5" font-weight="bold" fill="#CBD5E1" letter-spacing="2">MONITOR  •  SIMULATE  •  ANALYZE  •  EXPORT</text>
<rect x="235" y="272" width="430" height="32" rx="16" fill="#0B0609" fill-opacity="0.82" stroke="#EF4444" stroke-opacity="0.45"/>
<text x="450" y="292.5" text-anchor="middle" class="m" font-size="12" font-weight="bold" fill="#FCA5A5" letter-spacing="1.2">BY ANANDA GITA APRIL YANTO  &amp;  RIHHADATUL ALIYAH</text>
<rect x="1" y="1" width="898" height="338" rx="19" fill="none" stroke="#3A0D18" stroke-width="2"/>
</g>
</svg>
