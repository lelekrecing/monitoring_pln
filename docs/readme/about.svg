<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14090D"/><stop offset="1" stop-color="#090608"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C451"/><stop offset="0.5" stop-color="#EF4444"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5C451" stop-opacity="0.14"/><stop offset="1" stop-color="#EF4444" stop-opacity="0.06"/></linearGradient>
</defs>
<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes ping{0%{r:5;opacity:.85}100%{r:13;opacity:0}}
@keyframes shine{0%{transform:translateX(-180px)}100%{transform:translateX(980px)}}
.sw{stroke-dasharray:180 820;animation:sweep 6s linear infinite}
.pg{animation:ping 2s ease-out infinite}
.sh{animation:shine 5.5s ease-in-out infinite}
</style>
<clipPath id="cl"><rect x="2" y="2" width="896" height="232" rx="18"/></clipPath>
<rect x="2" y="2" width="896" height="232" rx="18" fill="url(#bg)" stroke="#3A1A22" stroke-width="2"/>
<g clip-path="url(#cl)"><rect class="sh" x="0" y="-20" width="70" height="280" fill="#FFFFFF" opacity=".035" transform="skewX(-20)"/></g>
<rect class="sw" x="2" y="2" width="896" height="232" rx="18" fill="none" stroke="url(#bd)" stroke-width="2.5" stroke-linecap="round" pathLength="1000"/>
<rect x="24" y="22" width="218" height="28" rx="14" fill="url(#gl)" stroke="#F5C451" stroke-opacity="0.4"/>
<circle cx="42" cy="36" r="5" fill="#F5C451"/><circle class="pg" cx="42" cy="36" r="5" fill="none" stroke="#F5C451" stroke-width="2"/>
<text x="56" y="40.5" class="m" font-size="11.5" font-weight="bold" fill="#F5C451" letter-spacing="1.4">TENTANG SIGINJAI PLN</text>
<text x="24" y="82" class="s" font-size="22" font-weight="800" fill="#F8FAFC">Pusat Kendali Monitoring, Konstruksi &amp; Kajian Kelayakan UP3 Jambi</text>
<text x="24" y="114" class="s" font-size="14.5" fill="#CBD5E1">Platform web terintegrasi berbasis Laravel untuk memantau kontrak KHS, data Tiang &amp; Pelanggan,</text>
<text x="24" y="136" class="s" font-size="14.5" fill="#CBD5E1">katalog Standar Konstruksi SUTM, serta perhitungan KKO-KKF &amp; kuota vendor secara real-time.</text>
<rect x="24" y="160" width="202" height="50" rx="12" fill="#1B0E14" stroke="#3A1A22"/>
<text x="40" y="182" class="m" font-size="11" font-weight="bold" fill="#F5C451">PUSAT MONITORING</text>
<text x="40" y="200" class="s" font-size="13" font-weight="700" fill="#F8FAFC">KHS · Tiang · Pelanggan</text>
<rect x="240" y="160" width="208" height="50" rx="12" fill="#1B0E14" stroke="#3A1A22"/>
<text x="256" y="182" class="m" font-size="11" font-weight="bold" fill="#FB923C">KAJIAN KELAYAKAN</text>
<text x="256" y="200" class="s" font-size="13" font-weight="700" fill="#F8FAFC">KKO/KKF · Simulasi Cepat</text>
<rect x="462" y="160" width="204" height="50" rx="12" fill="#1B0E14" stroke="#3A1A22"/>
<text x="478" y="182" class="m" font-size="11" font-weight="bold" fill="#34D399">KONTROL KUOTA</text>
<text x="478" y="200" class="s" font-size="13" font-weight="700" fill="#F8FAFC">Kuota Kontrak Per Vendor</text>
<rect x="680" y="160" width="196" height="50" rx="12" fill="#1B0E14" stroke="#3A1A22"/>
<text x="696" y="182" class="m" font-size="11" font-weight="bold" fill="#38BDF8">PELAPORAN CEPAT</text>
<text x="696" y="200" class="s" font-size="13" font-weight="700" fill="#F8FAFC">Export PDF &amp; Excel (.xlsx)</text>
</svg>
