<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050305"/><stop offset="1" stop-color="#1C0810"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FEF3C7"/><stop offset="0.5" stop-color="#F5C451"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EF4444" stop-opacity="0.55"/><stop offset="1" stop-color="#7F1D1D" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect width="900" height="170" rx="18"/></clipPath>
</defs>
<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:1}}
.em{animation:fl 4s ease-in-out infinite}
</style>
<g clip-path="url(#cl)">
<rect width="900" height="170" fill="url(#bg)"/>
<circle cx="450" cy="130" r="85" fill="url(#sun)"/>
<polygon points="0,170 150,95 310,140 460,82 620,136 780,90 900,135 900,170" fill="#18070D"/>
<polygon points="0,170 210,122 410,152 600,115 800,148 900,120 900,170" fill="#0B0508"/>
<circle class="em" cx="120" cy="52" r="2" fill="#F5C451" style="animation-delay:.2s"/>
<circle class="em" cx="265" cy="36" r="1.6" fill="#FFFFFF" style="animation-delay:.9s"/>
<circle class="em" cx="635" cy="42" r="1.8" fill="#F5C451" style="animation-delay:1.5s"/>
<circle class="em" cx="790" cy="58" r="2.1" fill="#EF4444" style="animation-delay:2.1s"/>
<text x="450" y="76" text-anchor="middle" class="m" font-size="22" font-weight="bold" fill="url(#tg)" letter-spacing="5">MONITOR  •  ANALYZE  •  DEPLOY</text>
<text x="450" y="106" text-anchor="middle" class="s" font-size="13.5" font-weight="700" fill="#CBD5E1" letter-spacing="2">SIGINJAI PLN UP3 JAMBI  •  ANANDA GITA APRIL YANTO &amp; RIHHADATUL ALIYAH</text>
<rect x="1" y="1" width="898" height="168" rx="17" fill="none" stroke="#3A1520" stroke-width="2"/>
</g>
</svg>
