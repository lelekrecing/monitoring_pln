<text x="268" y="108" text-anchor="middle" class="m" font-size="11.5" font-weight="bold" fill="#CBD5E1">Data &amp; Standar Teknis</text>
<circle cx="32" cy="134" r="5" fill="#38BDF8"/><circle class="pg" cx="32" cy="134" r="5" fill="none" stroke="#38BDF8" stroke-width="2"/>
<text x="46" y="138" class="s" font-size="12.5" font-weight="700" fill="#38BDF8">Co-Contributor • SIGINJAI PLN</text>
</g>
</svg>
