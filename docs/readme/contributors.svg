<text x="105" y="108" text-anchor="middle" class="m" font-size="11.5" font-weight="bold" fill="#CBD5E1">Full-Stack &amp; System Flow</text>
<rect x="196" y="92" width="134" height="24" rx="12" fill="#1E1217" stroke="#3A1F26"/>
<text x="263" y="108" text-anchor="middle" class="m" font-size="11.5" font-weight="bold" fill="#CBD5E1">PDF / Excel / UI</text>
<circle cx="32" cy="134" r="5" fill="#F5C451"/><circle class="pg" cx="32" cy="134" r="5" fill="none" stroke="#F5C451" stroke-width="2"/>
<text x="46" y="138" class="s" font-size="12.5" font-weight="700" fill="#F5C451">Lead Contributor • SIGINJAI PLN</text>
</g>

<g transform="translate(460,12)">
<clipPath id="k2"><rect x="1" y="1" width="428" height="150" rx="16"/></clipPath>
<rect x="1" y="1" width="428" height="150" rx="16" fill="url(#bg)" stroke="#3A1F26" stroke-width="2"/>
<g clip-path="url(#k2)"><rect class="sh" x="0" y="-20" width="50" height="200" fill="#FFFFFF" opacity=".04" transform="skewX(-20)"/></g>
<rect class="bd" x="1" y="1" width="428" height="150" rx="16" fill="none" stroke="url(#g2)" stroke-width="3" stroke-linecap="round" pathLength="1000" style="animation-delay:-2.5s"/>
<rect x="22" y="24" width="50" height="50" rx="14" fill="url(#g2)"/>
<text x="47" y="56" text-anchor="middle" class="s" font-size="18" font-weight="900" fill="#FFFFFF">RA</text>
<text x="86" y="45" class="s" font-size="18.5" font-weight="800" fill="#F8FAFC">Rihhadatul Aliyah</text>
