<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="100%">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5C451"/><stop offset="1" stop-color="#EF4444"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150C10"/><stop offset="1" stop-color="#0A0709"/></linearGradient>
</defs>
<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
@keyframes ping{0%{r:5;opacity:.85}100%{r:13;opacity:0}}
@keyframes shine{0%{transform:translateX(-140px)}100%{transform:translateX(540px)}}
.bd{stroke-dasharray:140 860;animation:sweep 5s linear infinite}
.pg{animation:ping 1.8s ease-out infinite}
.sh{animation:shine 5s ease-in-out infinite}
</style>
<g transform="translate(10,12)">
<clipPath id="k1"><rect x="1" y="1" width="428" height="150" rx="16"/></clipPath>
<rect x="1" y="1" width="428" height="150" rx="16" fill="url(#bg)" stroke="#3A1F26" stroke-width="2"/>
<g clip-path="url(#k1)"><rect class="sh" x="0" y="-20" width="50" height="200" fill="#FFFFFF" opacity=".04" transform="skewX(-20)"/></g>
<rect class="bd" x="1" y="1" width="428" height="150" rx="16" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" pathLength="1000"/>
<rect x="22" y="24" width="50" height="50" rx="14" fill="url(#g1)"/>
<text x="47" y="56" text-anchor="middle" class="s" font-size="18" font-weight="900" fill="#111827">AG</text>
<text x="86" y="45" class="s" font-size="18.5" font-weight="800" fill="#F8FAFC">Ananda Gita April Yanto</text>
<text x="86" y="68" class="m" font-size="12" font-weight="bold" fill="#F5C451">@lelekrecing • Contributor</text>
