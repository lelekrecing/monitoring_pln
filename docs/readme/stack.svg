<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sw{0%{stroke-dashoffset:520}100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.04}50%{opacity:.13}}
.cd{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
.fl{animation:fl 4.5s ease-in-out infinite}
.bd{stroke-dasharray:90 430;animation:sw 4s linear infinite}
.gl{animation:pulse 3.5s ease-in-out infinite}
</style>
